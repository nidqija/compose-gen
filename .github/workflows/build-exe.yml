name: Build Executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Windows Executable
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v -ldflags="-s -w" -o compose-gen.exe .

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-gen-windows-amd64
          path: compose-gen.exe
          retention-days: 30

      - name: Determine Target Release Tag
        id: get_tag
        run: |
          CHANGELOG_VER=""
          if [ -f "CHANGELOG.md" ]; then
            CHANGELOG_VER=$(grep -m 1 -E '^## (Version|\[?[0-9]+\.[0-9]+\.[0-9]+)' CHANGELOG.md | grep -o -E '[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi

          if [ -n "$CHANGELOG_VER" ]; then
            TAG="v$CHANGELOG_VER"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          fi

          echo "Target Release Tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Attach Executable to GitHub Release
        if: steps.get_tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: compose-gen.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
