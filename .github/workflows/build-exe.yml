name: Build Executable

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Windows Executable
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -v -ldflags="-s -w" -o compose-gen.exe .

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compose-gen-windows-amd64
          path: compose-gen.exe
          retention-days: 30

      - name: Upload to GitHub Release (if on a tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: compose-gen.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
